[project]
name = "payment-processing-service"
version = "1.0.0"
description = "Асинхронный сервис процессинга платежей: FastAPI, RabbitMQ, PostgreSQL, Outbox pattern"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.40.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.14.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.31.0",
    "alembic>=1.18.0",
    "faststream[rabbit]>=0.7.1,<0.8",
    "httpx>=0.28.1",
    "structlog>=26.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.0",
    "mypy>=2.2.0",
    "asgi-lifespan>=2.1.0",
]

[project.scripts]
payments-api = "payments.entrypoints.api:main"
payments-consumer = "payments.entrypoints.consumer:main"
payments-relay = "payments.entrypoints.relay:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payments"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "ASYNC",# flake8-async
    "S",    # flake8-bandit
    "DTZ",  # flake8-datetimez — запрет наивных datetime
]
ignore = [
    "S101",    # assert разрешён в тестах
    # Проект русскоязычный: кириллица в строках и комментариях — норма,
    # а не «похожие на латиницу» символы.
    "RUF001",  # ambiguous unicode в строках
    "RUF002",  # ambiguous unicode в docstring
    "RUF003",  # ambiguous unicode в комментариях
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S311"]
"src/payments/domain/gateway.py" = ["S311"]  # random для эмуляции, не крипта
"src/payments/db/migrations/*" = ["I001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["src/payments/db/migrations/versions/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Фикстуры и тесты обязаны жить в одном event loop: иначе asyncpg-соединение,
# созданное в session-loop, роняет тест в function-loop («attached to a different loop»).
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: требует PostgreSQL (docker compose up -d postgres)",
    "e2e: требует полный стек (docker compose up -d)",
]
filterwarnings = ["error::DeprecationWarning:payments.*"]

[tool.coverage.run]
source = ["src/payments"]
omit = ["*/migrations/*", "*/entrypoints/*"]
# SQLAlchemy async выполняет драйвер в greenlet — без этого часть строк «теряется».
concurrency = ["greenlet", "thread"]
